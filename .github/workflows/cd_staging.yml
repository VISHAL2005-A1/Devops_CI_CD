name: Deploy to Ubuntu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            echo "===== SERVER ====="
            whoami
            pwd

            echo "===== PROJECT ====="
            cd ~/Devops_CI_CD
            git status
            git branch

            echo "===== PULL MAIN ====="
            git fetch origin
            git reset --hard origin/main

            echo "===== NODE ====="
            node -v
            pnpm -v

            echo "===== INSTALL ====="
            pnpm install

            echo "===== PRISMA ====="
            pnpm --filter @repo/db generate

            echo "===== DB BUILD ====="
            pnpm --filter @repo/db build

            echo "===== WEB BUILD ====="
            cd ~/Devops_CI_CD/apps/web
            pnpm build

            echo "===== HTTP BUILD ====="
            cd ~/Devops_CI_CD/apps/http-server
            pnpm build

            echo "===== WS BUILD ====="
            cd ~/Devops_CI_CD/apps/ws-server
            pnpm build

            echo "===== PM2 ====="
            pm2 list

            pm2 restart web-server
            pm2 restart http-server
            pm2 restart ws-server

            echo "===== DEPLOYMENT SUCCESS ====="